<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tajna kutija 🔒</title>
<style>
  /* ============ EDIT ME ============ */
  :root {
    --bg1: #fbf3e2;      /* krem */
    --bg2: #d7e6dc;      /* nežno zelena */
    --accent: #c2693f;   /* terakota */
    --text: #33423d;     /* tamna šuma */
    --deep1: #4b7a70;
    --deep2: #2b4d47;
    --night: #12261f;
    --gold: #e3b95c;
  }
  /* ================================= */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2), #f3e3c0, var(--bg2));
    background-size: 320% 320%;
    animation: bgshift 16s ease-in-out infinite;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes bgshift { 0%,100% { background-position: 0% 20%; } 50% { background-position: 100% 80%; } }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .slot, .digit-found, .key { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }

  /* ambient twinkles behind everything */
  .tw {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, #fff 0, rgba(227,185,92,.9) 40%, transparent 70%);
    animation: twinkle var(--t, 3s) ease-in-out infinite; animation-delay: var(--d, 0s);
  }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3); } 50% { opacity: .9; transform: scale(1); } }

  /* ---------- HUD ---------- */
  .hud {
    position: relative; z-index: 2;
    width: min(94vw, 420px);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .code-slots { display: flex; gap: 6px; }
  .slot {
    width: 34px; height: 42px; border-radius: 10px;
    background: #fff; box-shadow: 0 3px 8px rgba(43, 77, 71, .14);
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-size: 1.4rem; color: rgba(43, 77, 71, .3);
    transition: transform .3s, background .3s, color .3s;
  }
  .slot.found {
    color: var(--accent); background: linear-gradient(135deg, #fffaf0, #ffe9b0);
    box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(227,185,92,.8);
    animation: slotpop .7s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes slotpop { 0% { transform: scale(.4) rotate(-20deg); } 60% { transform: scale(1.35) rotate(6deg); } 100% { transform: none; } }
  .hud-btns { display: flex; gap: 8px; }
  .pill {
    background: #fff; border-radius: 999px; padding: 9px 13px;
    font-size: .9rem; box-shadow: 0 3px 8px rgba(43, 77, 71, .14);
  }
  .pill:active { transform: scale(.94); }

  /* ---------- room ---------- */
  .room {
    position: relative; z-index: 2;
    width: min(94vw, 420px, calc((100vh - 130px) * 0.78));
    aspect-ratio: 3 / 4;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(43, 77, 71, .3), 0 0 0 3px rgba(255,255,255,.5);
    container-type: inline-size;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,240,200,.55), transparent 60%),
      linear-gradient(to bottom, #e8dcc2 0, #e8dcc2 62%, #b98b5e 62%, #a67a50 100%);
  }
  .wall-trim { position: absolute; left: 0; right: 0; top: 62%; height: 3px; background: rgba(0,0,0,.12); }
  .floor-shine {
    position: absolute; left: -20%; right: -20%; top: 62%; bottom: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
    animation: sweep 6s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }
  .rug {
    position: absolute; left: 50%; top: 86%; width: 62cqw; height: 18cqw;
    translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(ellipse, #c98f5c 0 35%, #9b5f3b 36% 55%, #c98f5c 56% 75%, #8a5231 76%);
    opacity: .55;
  }
  .lamp-glow {
    position: absolute; left: 62%; top: 52%; width: 40cqw; height: 40cqw;
    translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,120,.7), transparent 65%);
    animation: breathe 3.5s ease-in-out infinite; pointer-events: none;
  }
  @keyframes breathe { 50% { opacity: .45; transform: scale(1.18); } }

  /* the animated window */
  .win {
    position: absolute; left: 50%; top: 21%; translate: -50% -50%;
    width: 27cqw; height: 25cqw; padding: 0;
    border: 1.3cqw solid #8a5a35; border-radius: 2.5cqw 2.5cqw 1cqw 1cqw;
    background: #f6c28f; overflow: hidden;
    box-shadow: 0 0 5cqw rgba(255,230,160,.6), inset 0 0 3cqw rgba(0,0,0,.25);
    animation: sky 16s linear infinite;
  }
  .win::before, .win::after { content: ""; position: absolute; background: #8a5a35; z-index: 2; }
  .win::before { left: 50%; top: 0; bottom: 0; width: .9cqw; translate: -50% 0; }
  .win::after  { top: 50%; left: 0; right: 0; height: .9cqw; translate: 0 -50%; }
  .orb {
    position: absolute; width: 7cqw; height: 7cqw; border-radius: 50%;
    animation: orb 16s linear infinite; z-index: 1;
    box-shadow: 0 0 3cqw currentColor; color: #ffd36b;
  }
  @keyframes sky {
    0% { background-color: #f6c28f; } 22% { background-color: #8ed0f7; } 50% { background-color: #8ed0f7; }
    60% { background-color: #ee8f62; } 72% { background-color: #24305e; } 92% { background-color: #1a2450; } 100% { background-color: #f6c28f; }
  }
  @keyframes orb {
    0%   { left: -5cqw; top: 14cqw; background: #ffb24d; color: #ffb24d; }
    28%  { left: 8cqw;  top: 1cqw;  background: #fff2a8; color: #fff2a8; }
    55%  { left: 20cqw; top: 9cqw;  background: #ff9a52; color: #ff9a52; }
    66%  { left: 24cqw; top: 22cqw; background: #ff7a45; color: #ff7a45; }
    70%  { left: -4cqw; top: 18cqw; background: #e8eefc; color: #e8eefc; }
    85%  { left: 9cqw;  top: 2cqw;  background: #f4f7ff; color: #f4f7ff; }
    100% { left: 24cqw; top: 16cqw; background: #e8eefc; color: #e8eefc; }
  }

  .obj {
    position: absolute; translate: -50% -50%;
    background: none; line-height: 1; font-size: 15cqw;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.2));
    animation: bob 3.6s ease-in-out infinite; animation-delay: var(--d, 0s);
  }
  .obj.big { font-size: 22cqw; }
  .obj.boing { animation: boing .45s ease; }
  @keyframes bob { 50% { transform: translateY(-1.1cqw) rotate(var(--r, 1.2deg)); } }
  @keyframes boing { 40% { transform: scale(1.3) rotate(-6deg); } 70% { transform: scale(.92); } }
  .obj.ping::before {
    content: ""; position: absolute; inset: 8%; border-radius: 50%;
    border: 2px solid var(--gold); z-index: 3; pointer-events: none;
    animation: ping 2.2s ease-out infinite; animation-delay: var(--d, 0s);
  }
  .win.ping { animation: sky 16s linear infinite, winping 2.2s ease-out infinite; }
  @keyframes winping { 0% { box-shadow: 0 0 0 0 rgba(227,185,92,.9), 0 0 5cqw rgba(255,230,160,.6); } 100% { box-shadow: 0 0 0 4cqw rgba(227,185,92,0), 0 0 5cqw rgba(255,230,160,.6); } }
  @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
  .obj.done::after {
    content: "✓"; position: absolute; right: -4px; top: -4px;
    width: 6cqw; height: 6cqw; font-size: 3.8cqw; border-radius: 50%;
    background: var(--deep1); color: #fff; display: flex; align-items: center; justify-content: center;
    filter: none; box-shadow: 0 0 10px var(--gold);
  }
  .win.done { box-shadow: 0 0 6cqw var(--gold); }
  .obj.pulse { animation: pulse 1.2s ease-in-out infinite; filter: drop-shadow(0 0 12px var(--gold)) drop-shadow(0 0 24px var(--gold)); }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  .lock-badge { position: absolute; right: -2cqw; bottom: -2cqw; font-size: 7cqw; filter: none; }
  .rays {
    position: absolute; left: 50%; top: 84%; width: 150cqw; height: 150cqw; translate: -50% -50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,226,140,.55) 0 8deg, transparent 8deg 20deg);
    border-radius: 50%; opacity: 0; pointer-events: none;
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 68%); mask-image: radial-gradient(circle, #000 0, transparent 68%);
    transition: opacity .8s; animation: spin 14s linear infinite;
  }
  .rays.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fly {
    position: absolute; translate: -50% -50%;
    background: none; font-size: 7.5cqw; opacity: .6; line-height: 1; padding: 8px;
    animation: flutter var(--ft, 3s) ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.7));
  }
  @keyframes flutter {
    0%,100% { transform: translate(0,0) rotate(0); }
    30% { transform: translate(3cqw,-2cqw) rotate(14deg); }
    60% { transform: translate(-2cqw,-3.5cqw) rotate(-10deg); }
  }
  .fly.found { opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; transform: translateY(-9cqw) scale(1.8); animation: none; }
  .mote {
    position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,244,200,.9);
    box-shadow: 0 0 6px #fff; opacity: 0; pointer-events: none;
    animation: mote var(--t, 9s) linear infinite; animation-delay: var(--d, 0s);
  }
  @keyframes mote { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--x, 10px), -60cqw); opacity: 0; } }

  .toast {
    position: absolute; left: 50%; bottom: 3%;
    transform: translate(-50%, 20px);
    background: rgba(43, 77, 71, .95); color: #fff;
    padding: 10px 16px; border-radius: 14px; font-size: .95rem; text-align: center; line-height: 1.35;
    width: max-content; max-width: 90%;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 4;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- sheet ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(18, 38, 31, .55); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 6;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(100vw, 460px); background: #fff;
    border-radius: 26px 26px 0 0; padding: 22px 18px 26px; text-align: center;
    transform: translateY(70px) scale(.97); transition: transform .45s cubic-bezier(.2, 1.3, .4, 1);
    max-height: 90vh; overflow: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,.2);
  }
  .scrim.show .sheet { transform: none; }
  .sheet h2 { font-family: Georgia, serif; font-weight: normal; font-size: 1.35rem; margin-bottom: 6px; }
  .sheet p { line-height: 1.45; margin-bottom: 14px; }
  .emoji-lg { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.05); } 75% { transform: rotate(8deg) scale(1.05); } }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .opt {
    background: var(--bg1); border-radius: 14px; padding: 13px 18px; font-size: 1.08rem;
    border: 2px solid transparent; transition: transform .15s, background .2s;
  }
  .opt:active { transform: scale(.94); }
  .opt.wrong { background: #f6d9cf; animation: shake .4s; }
  .opt.right { background: #dcefd9; border-color: var(--deep1); animation: slotpop .6s; }
  .tile-opt { font-size: 2.3rem; width: 70px; height: 70px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .tile-opt.used { opacity: .25; pointer-events: none; transform: scale(.85); }
  .seq-slots { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; min-height: 52px; }
  .seq-slot {
    width: 50px; height: 50px; border-radius: 12px; border: 2px dashed rgba(43,77,71,.3);
    display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
  }
  .seq-slot.filled { border-style: solid; border-color: var(--gold); background: #fff8e4; animation: slotpop .4s; }
  .btn-main {
    background: linear-gradient(135deg, var(--deep1), var(--deep2)); color: #fff;
    padding: 13px 28px; border-radius: 999px; font-size: 1.05rem;
    box-shadow: 0 6px 16px rgba(43, 77, 71, .3);
  }
  .btn-main:active { transform: scale(.96); }
  .btn-ghost { background: none; opacity: .6; padding: 10px; margin-top: 4px; font-size: .95rem; }
  .digit-found {
    font-family: Georgia, serif; font-size: 4.4rem; margin: 2px 0 6px; line-height: 1.1;
    background: linear-gradient(120deg, var(--accent), var(--gold), var(--accent)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: digitIn .9s cubic-bezier(.2, 1.5, .4, 1), shimmer 2.5s linear infinite;
  }
  @keyframes digitIn { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .shake { animation: shake .4s; }

  .display { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .display .slot { width: 48px; height: 60px; font-size: 1.9rem; color: var(--text); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto; }
  .key { background: var(--bg1); border-radius: 14px; padding: 14px 0; font-size: 1.4rem; font-family: Georgia, serif; }
  .key:active { background: #ffe9b0; transform: scale(.93); }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 12px;
    opacity: 0; pointer-events: none; transition: opacity 1.1s ease; z-index: 8;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay > * { position: relative; z-index: 2; }

  #intro {
    background: radial-gradient(circle at 50% 28%, #3f7468 0, #1f4039 55%, var(--night) 100%);
    color: var(--bg1); opacity: 1; pointer-events: auto; z-index: 9; transition: opacity .7s;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro .emoji { font-size: 5rem; line-height: 1; transform-origin: 50% 0; animation: swing 2.4s ease-in-out infinite; filter: drop-shadow(0 0 18px var(--gold)); }
  @keyframes swing { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  #intro .big {
    font-family: Georgia, serif; font-size: clamp(2.2rem, 11vw, 3.2rem); line-height: 1.1;
    background: linear-gradient(110deg, #f6e08a 20%, #fff 40%, #e3b95c 60%, #f6e08a 80%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 3s linear infinite;
  }
  #intro .for { color: var(--gold); letter-spacing: 2px; text-transform: uppercase; font-size: .85rem; }
  #intro .small { font-size: 1.08rem; line-height: 1.5; max-width: 330px; opacity: .92; }
  #intro .btn-main {
    margin-top: 12px; background: linear-gradient(135deg, #f6e08a, #d9a73c); color: #3a2a08; font-weight: 600;
    box-shadow: 0 0 0 0 rgba(227,185,92,.7); animation: glowpulse 1.8s ease-out infinite;
  }
  @keyframes glowpulse { 70% { box-shadow: 0 0 0 18px rgba(227,185,92,0); } 100% { box-shadow: 0 0 0 0 rgba(227,185,92,0); } }

  #overlay { background: radial-gradient(circle at 50% 38%, #fffaf0 0, var(--bg1) 45%, var(--bg2) 100%); }
  .burst-rays {
    position: absolute !important; left: 50%; top: 38%; width: 190vmax; height: 190vmax; translate: -50% -50%;
    background: repeating-conic-gradient(from 0deg, rgba(227,185,92,.32) 0 7deg, transparent 7deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 60%); mask-image: radial-gradient(circle, #000 0, transparent 60%);
    animation: spin 30s linear infinite; z-index: 1 !important;
  }
  .rise { opacity: 0; }
  .overlay.show .rise { animation: riseIn .9s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: calc(var(--i, 0) * .28s + .5s); }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(26px) scale(.85); } 100% { opacity: 1; transform: none; } }
  #overlay .emoji { font-size: 5.4rem; line-height: 1; filter: drop-shadow(0 0 22px rgba(227,185,92,.9)); }
  .overlay.show .emoji.rise { animation: riseIn .9s cubic-bezier(.2, 1.4, .4, 1) .4s both, bounce 2.2s ease-in-out 1.5s infinite; }
  @keyframes bounce { 50% { transform: translateY(-12px) rotate(4deg); } }
  #overlay .pre { font-size: 1.05rem; letter-spacing: 1px; color: var(--deep1); }
  #overlay .big {
    font-family: Georgia, serif; font-size: clamp(1.9rem, 9vw, 2.8rem); line-height: 1.15; color: var(--accent);
    text-shadow: 0 2px 0 #fff, 0 0 24px rgba(227,185,92,.7);
  }
  #overlay .small { font-size: 1.1rem; line-height: 1.5; max-width: 330px; }
  #overlay .date { padding: 10px 20px; border-radius: 999px; background: #fff; font-weight: 600; letter-spacing: .5px; box-shadow: 0 0 0 2px var(--gold), 0 6px 18px rgba(227,185,92,.4); }
  #overlay .after { opacity: .85; }
  .again {
    margin-top: 10px; padding: 10px 20px; border-radius: 999px; border: 2px solid rgba(43, 77, 71, .25);
    background: rgba(255,255,255,.6); color: var(--text); font-size: .95rem;
  }
  .again:active { transform: scale(.96); }
  .floater {
    position: absolute !important; bottom: -60px; z-index: 1 !important; pointer-events: none;
    animation: floatup var(--t, 8s) ease-in infinite; animation-delay: var(--d, 0s);
  }
  @keyframes floatup { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--x, 20px), -115vh) rotate(var(--rot, 20deg)); opacity: 1; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 25; }
  #flash.go { animation: flash 1s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: .95; } 100% { opacity: 0; } }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { .tw, .mote, .floater { display: none; } }
</style>
</head>
<body>

  <div class="hud">
    <div class="code-slots" id="slots"></div>
    <div class="hud-btns">
      <button class="pill" id="soundBtn" aria-label="Zvuk">🔊</button>
      <button class="pill" id="hintBtn">💡 Nagoveštaj</button>
    </div>
  </div>

  <div class="room" id="room">
    <div class="wall-trim"></div>
    <div class="floor-shine"></div>
    <div class="rug"></div>
    <div class="lamp-glow"></div>
    <div class="rays" id="rays"></div>

    <button class="win ping" id="oWindow" aria-label="Prozor"><span class="orb"></span></button>
    <button class="obj ping" id="oClock"   style="left:84%;top:19%;--d:.3s">🕰️</button>
    <button class="obj"      id="oPicture" style="left:16%;top:21%;--d:.9s;--r:-1.5deg">🖼️</button>
    <button class="obj big ping" id="oBooks" style="left:17%;top:57%;--d:.6s">📚</button>
    <button class="obj ping" id="oPlant"   style="left:85%;top:55%;--d:1.2s">🪴</button>
    <button class="obj big ping" id="oSofa" style="left:50%;top:60%;--d:.1s">🛋️</button>
    <button class="obj big" id="oBox" style="left:50%;top:84%;--d:.4s">🧰<span class="lock-badge" id="lockBadge">🔒</span></button>

    <button class="fly" data-f="0" style="left:8%;top:41%;--ft:3.2s">🦋</button>
    <button class="fly" data-f="1" style="left:68%;top:39%;--ft:2.7s">🦋</button>
    <button class="fly" data-f="2" style="left:90%;top:90%;--ft:3.6s">🦋</button>

    <div class="toast" id="toast"></div>
  </div>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

  <div class="overlay" id="intro">
    <div class="emoji">🔒</div>
    <div class="big">Tajna kutija</div>
    <div class="for" id="forLine"></div>
    <div class="small">Neko je zaključao porodičnu tajnu u kutiju. Prošetajte po sobi, rešite zagonetke i sakupite <b>kod od četiri cifre</b>.</div>
    <button class="btn-main" id="startBtn">Hajde!</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="burst-rays"></div>
    <div class="emoji rise" style="--i:0">👶</div>
    <div class="pre rise" style="--i:1">Klik! Kutija se otvorila…</div>
    <div class="big rise" id="reveal" style="--i:2"></div>
    <div class="small rise" style="--i:3">Mali novi član porodice<br>je na putu 💕</div>
    <div class="date rise" id="due" style="--i:4"></div>
    <div class="after rise" id="after" style="--i:5"></div>
    <button class="again rise" style="--i:6" onclick="location.reload()">↻ Igraj ponovo</button>
  </div>

  <div id="flash"></div>
  <canvas id="fx"></canvas>

<script>
/* ===================== UREDI OVDE =====================
   Personalizacija preko linka:
     escape.html?for=Baka
     escape.html?for=Tetka%20Mara&line=Postajete%20tetka!
   - for  = ime (piše na uvodnom ekranu)
   - line = cela rečenica na kraju (da gramatika bude tačna)
   - code = kod od 4 cifre (podrazumevano 0527)
   Obraćanje je sa "vi". Za "ti" izmenite tekstove ispod.
   ======================================================== */
const DEFAULT_LINE = "Postajete baka i deka!";
const DEFAULT_CODE = "0527";                    // maj 2027 (mesec + godina)
const DUE_TEXT     = "Stiže u maju 2027.";
const AFTER_TEXT   = "Volimo vas! A sad nas pozovite 📞";

/* ---------- osnovno ---------- */
const params = new URLSearchParams(location.search);
const who  = params.get("for");
const LINE = params.get("line") || DEFAULT_LINE;
const codeParam = (params.get("code") || "").replace(/\D/g, "");
const CODE = codeParam.length === 4 ? codeParam : DEFAULT_CODE;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const buzz = p => navigator.vibrate && navigator.vibrate(p);
const wait = ms => new Promise(r => setTimeout(r, ms));
if (who) $("forLine").textContent = `Za: ${who}`;
$("due").textContent = DUE_TEXT;
$("after").textContent = AFTER_TEXT;

/* ---------- ambient sparkles ---------- */
(function ambient() {
  for (let i = 0; i < 26; i++) {
    const t = document.createElement("div"); t.className = "tw";
    const s = 4 + Math.random() * 9;
    t.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--t:${2+Math.random()*3}s;--d:${-Math.random()*4}s`;
    document.body.appendChild(t);
  }
  const room = $("room");
  for (let i = 0; i < 14; i++) {
    const m = document.createElement("div"); m.className = "mote";
    m.style.cssText = `left:${Math.random()*100}%;top:${60+Math.random()*40}%;--t:${7+Math.random()*7}s;--d:${-Math.random()*10}s;--x:${(Math.random()-.5)*40}px`;
    room.appendChild(m);
  }
  const intro = $("intro");
  for (let i = 0; i < 40; i++) {
    const t = document.createElement("div"); t.className = "tw";
    const s = 3 + Math.random() * 8;
    t.style.cssText = `position:absolute;z-index:1;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--t:${1.5+Math.random()*3}s;--d:${-Math.random()*4}s`;
    intro.appendChild(t);
  }
})();

/* ---------- zvuk (WebAudio, bez fajlova) ---------- */
let AC = null, soundOn = true;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, at, dur, type = "sine", vol = .14) {
  const c = ac(); if (!c || !soundOn) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = c.currentTime + at;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
}
const sfx = {
  tap:  () => tone(660, 0, .08, "triangle", .08),
  good: () => { tone(660, 0, .15); tone(880, .1, .2); },
  bad:  () => { tone(200, 0, .18, "sawtooth", .08); tone(150, .12, .22, "sawtooth", .08); },
  digit:() => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .3, "sine", .13)),
  win:  () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .13, .5, "triangle", .14)),
};
$("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = soundOn ? "🔊" : "🔇"; if (soundOn) sfx.tap(); };

/* ---------- efekti (čestice) ---------- */
const fx = $("fx"), fctx = fx.getContext("2d");
let parts = [], fxRunning = false;
function fxSize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0);
}
fxSize(); addEventListener("resize", fxSize);
const GOLDS = ["#ffe08a", "#e3b95c", "#fff4c2", "#f6c85f", "#ffffff"];
const MIX = ["#e3b95c", "#c2693f", "#4b7a70", "#f2d9a6", "#9cc5b0", "#f0a58a", "#ffffff"];
function emit(x, y, n, o = {}) {
  const { colors = GOLDS, speed = 6, life = 55, grav = .12, size = 5, shape = "star", drag = .985, up = 0 } = o;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (.3 + Math.random()) * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - up, life, max: life, grav, drag,
      s: size * (.6 + Math.random() * .9), rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0], shape });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
}
function drawStar(s) {
  fctx.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .25 : s; const a = i * Math.PI / 4; fctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  fctx.closePath(); fctx.fill();
}
function fxLoop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    fctx.save(); fctx.globalAlpha = Math.min(1, p.life / (p.max * .5));
    fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.c;
    if (p.shape === "star") { fctx.shadowColor = p.c; fctx.shadowBlur = 8; drawStar(p.s); }
    else if (p.shape === "rect") fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    else { fctx.beginPath(); fctx.arc(0, 0, p.s / 2, 0, 6.3); fctx.fill(); }
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
const sparkle = (el, n = 28) => { const [x, y] = center(el); emit(x, y, n, { speed: 5, size: 6 }); };
function fireworks(count = 7) {
  for (let i = 0; i < count; i++) setTimeout(() => {
    const x = innerWidth * (.15 + Math.random() * .7), y = innerHeight * (.15 + Math.random() * .4);
    const col = [MIX, GOLDS][i % 2];
    emit(x, y, 46, { colors: col, speed: 7, life: 70, grav: .06, size: 5, shape: "star", drag: .975 });
    emit(x, y, 20, { colors: col, speed: 3, life: 60, grav: .05, size: 3, shape: "dot" });
    sfx.tap();
  }, i * 380);
}
function confetti() {
  const burst = n => emit(innerWidth / 2, innerHeight * .45, n, { colors: MIX, speed: 10, life: 140, grav: .28, size: 9, shape: "rect", up: 7, drag: .99 });
  burst(140); setTimeout(() => burst(90), 500); setTimeout(() => burst(70), 1100);
}
function floaters() {
  const ov = $("overlay"), icons = ["🎈", "💗", "⭐", "🎈", "✨", "🧸"];
  for (let i = 0; i < 16; i++) {
    const f = document.createElement("div"); f.className = "floater";
    f.textContent = icons[i % icons.length];
    f.style.cssText = `left:${Math.random()*92}%;font-size:${1.6+Math.random()*1.8}rem;--t:${6+Math.random()*6}s;--d:${Math.random()*5}s;--x:${(Math.random()-.5)*80}px;--rot:${(Math.random()-.5)*50}deg`;
    ov.appendChild(f);
  }
}

/* ---------- stanje ---------- */
// zagonetke: 0 prozor (redosled), 1 sat (pitalica), 2 leptiri, 3 knjige (uljez)
const solved = [false, false, false, false];
const state = { note: false, flies: 0 };
const slotsEl = $("slots");
for (let i = 0; i < 4; i++) { const s = document.createElement("div"); s.className = "slot"; s.textContent = "?"; slotsEl.appendChild(s); }
const PUZZLE_OBJ = ["oWindow", "oClock", "oPlant", "oBooks"];

function boing(el) { el.classList.remove("boing"); void el.offsetWidth; el.classList.add("boing"); el.addEventListener("animationend", () => el.classList.remove("boing"), { once: true }); }
document.querySelectorAll(".obj, .win").forEach(o => o.addEventListener("click", () => { if (o.classList.contains("obj")) boing(o); sfx.tap(); }));

function award(i) {
  solved[i] = true;
  const s = slotsEl.children[i];
  s.textContent = CODE[i]; s.classList.add("found");
  const o = $(PUZZLE_OBJ[i]); o.classList.remove("ping"); o.classList.add("done");
  sparkle(s, 36); sparkle(o, 30);
  sfx.digit(); buzz([20, 40, 20]);
  if (solved.every(Boolean)) { $("oBox").classList.add("pulse"); $("rays").classList.add("on"); setTimeout(() => toast("Sve četiri cifre su tu! Otvorite kutiju 🔓", 3200), 1600); }
}

/* ---------- toast + sheet ---------- */
let toastTimer;
function toast(msg, ms = 2800) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function openSheet(html, handler) {
  $("sheet").innerHTML = html; $("scrim").classList.add("show");
  $("sheet").onclick = e => {
    if (e.target.closest("[data-close]")) return closeSheet();
    if (handler) handler(e);
  };
}
function closeSheet() { $("scrim").classList.remove("show"); }
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
const closeBtn = `<button class="btn-ghost" data-close>Zatvori</button>`;

function digitFound(i, intro) {
  openSheet(`
    <div class="emoji-lg">✨</div>
    <h2>${intro}</h2>
    <div class="digit-found">${CODE[i]}</div>
    <p>Cifra ${i + 1} od 4. Sačuvana je gore.</p>
    <button class="btn-main" data-close>Super</button>`);
  setTimeout(() => emit(innerWidth / 2, innerHeight * .62, 40, { speed: 6, size: 6 }), 350);
}

/* ---------- zagonetka 0: prozor (treba beleška) ---------- */
$("oWindow").onclick = () => {
  if (solved[0]) return toast("Već rešeno. Prelep pogled.");
  if (!state.note) {
    return openSheet(`
      <div class="emoji-lg">🪟</div><h2>Četiri čudna simbola</h2>
      <p>Na staklu se smenjuju 🌙 🌅 ☀️ 🌇, ali ne znate kojim redom idu. Možda je negde sakrivena beleška, na nekom udobnom mestu…</p>
      ${closeBtn}`);
  }
  const icons = ["🌙", "🌅", "☀️", "🌇"].sort(() => Math.random() - .5);
  const answer = ["🌅", "☀️", "🌇", "🌙"];
  let picked = [];
  const draw = () => openSheet(`
    <div class="emoji-lg">🪟</div><h2>Pratite belešku</h2>
    <p style="font-style:italic">„Od prvog svetla do poslednjeg, onako kako dan teče.“</p>
    <div class="seq-slots">${[0,1,2,3].map(i => `<div class="seq-slot ${picked[i] ? "filled" : ""}">${picked[i] || ""}</div>`).join("")}</div>
    <div class="row">${icons.map(ic => `<button class="opt tile-opt ${picked.includes(ic) ? "used" : ""}" data-ic="${ic}">${ic}</button>`).join("")}</div>
    ${closeBtn}`, onTap);
  function onTap(e) {
    const b = e.target.closest("[data-ic]"); if (!b) return;
    picked.push(b.dataset.ic); sfx.tap(); buzz(8); draw();
    if (picked.length === 4) {
      if (picked.every((x, i) => x === answer[i])) { award(0); setTimeout(() => digitFound(0, "Staklo se zasvetlelo!"), 500); }
      else { picked = []; sfx.bad(); buzz(80); toast("Nije to to. Nebo se vraća na početak…"); setTimeout(draw, 450); }
    }
  }
  draw();
};

/* ---------- beleška na sofi ---------- */
$("oSofa").onclick = () => {
  if (!state.note) {
    state.note = true; $("oSofa").classList.remove("ping");
    openSheet(`
      <div class="emoji-lg">📝</div><h2>Našli ste belešku!</h2>
      <p style="font-style:italic">„Od prvog svetla do poslednjeg, onako kako dan teče.“</p>
      <p>Izgleda da je ovo trag za nešto. Možda za prozor?</p>
      <button class="btn-main" data-close>Jasno</button>`);
    sparkle($("oSofa"), 26); sfx.good();
  } else toast("Udobno. Beleška je već u džepu 📝");
};

/* ---------- zagonetka 1: sat (pitalica) ---------- */
$("oClock").onclick = () => {
  if (solved[1]) return toast("Tik-tak. Rešeno.");
  openSheet(`
    <div class="emoji-lg">🕰️</div><h2>Sat progovara</h2>
    <p>„Šta mora da se razbije pre nego što se upotrebi?“</p>
    <div class="row">
      <button class="opt" data-a="0">Jaje</button>
      <button class="opt" data-a="1">Sat</button>
      <button class="opt" data-a="2">Prozor</button>
    </div>${closeBtn}`, e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      if (b.dataset.a === "0") { b.classList.add("right"); sfx.good(); award(1); setTimeout(() => digitFound(1, "Sat je zazvonio!"), 700); }
      else { b.classList.add("wrong"); sfx.bad(); buzz(60); }
    });
};

/* ---------- zagonetka 2: leptiri ---------- */
document.querySelectorAll(".fly").forEach(f => f.onclick = () => {
  if (f.classList.contains("found")) return;
  sparkle(f, 18); f.classList.add("found"); state.flies++; buzz(12); sfx.good();
  if (state.flies < 3) toast(`🦋 Uhvaćen! ${state.flies}/3`);
  else { award(2); setTimeout(() => digitFound(2, "Sva tri leptira!"), 700); }
});
$("oPlant").onclick = () => {
  if (solved[2]) return toast("Biljka je srećna 🌿");
  openSheet(`
    <div class="emoji-lg">🪴</div><h2>Nešto leprša u blizini</h2>
    <p>Tri leptirića kriju se po sobi. Pronađite sve — kažu da su to oni „leptirići u stomaku“.</p>
    <p style="opacity:.7">Pronađeno: ${state.flies}/3</p>
    <button class="btn-main" data-close>U redu</button>`);
};

/* ---------- zagonetka 3: knjige (uljez) ---------- */
$("oBooks").onclick = () => {
  if (solved[3]) return toast("Odlična biblioteka.");
  openSheet(`
    <div class="emoji-lg">📚</div><h2>Polica jednog astronoma</h2>
    <p>Jedna od ovih knjiga ne pripada ovde. Koja?</p>
    <div class="row">
      <button class="opt tile-opt" data-b="0">🌙</button>
      <button class="opt tile-opt" data-b="1">🪐</button>
      <button class="opt tile-opt" data-b="2">🍕</button>
      <button class="opt tile-opt" data-b="3">⭐</button>
    </div>${closeBtn}`, e => {
      const b = e.target.closest("[data-b]"); if (!b) return;
      if (b.dataset.b === "2") { b.classList.add("right"); sfx.good(); award(3); setTimeout(() => digitFound(3, "Skrivena stranica!"), 700); }
      else { b.classList.add("wrong"); sfx.bad(); buzz(60); }
    });
};

/* ---------- sitnice ---------- */
const picQuips = ["Lepa slika. Iza nje ništa… verovatno.", "Kriva je. Ispravite je. Ništa se ne dešava.", "Porodična fotografija. Svi izgledaju sumnjivo srećno."];
let pq = 0;
$("oPicture").onclick = () => toast(picQuips[pq++ % picQuips.length]);

/* ---------- kutija ---------- */
$("oBox").onclick = () => {
  let entry = "";
  const draw = () => openSheet(`
    <div class="emoji-lg">🔒</div><h2>Unesite kod</h2>
    <p style="margin-bottom:10px">${solved.every(Boolean) ? "Imate sve četiri cifre." : "Prvo pronađite sve četiri cifre."}</p>
    <div class="display" id="disp">${[0,1,2,3].map(i => `<div class="slot">${entry[i] || ""}</div>`).join("")}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join("")}
      <button class="key" data-k="x">⌫</button><button class="key" data-k="0">0</button><button class="key" data-close>✕</button>
    </div>`, onKey);
  function onKey(e) {
    const k = e.target.closest("[data-k]"); if (!k) return;
    buzz(6); sfx.tap();
    if (k.dataset.k === "x") entry = entry.slice(0, -1); else if (entry.length < 4) entry += k.dataset.k;
    draw();
    if (entry.length === 4) {
      if (entry === CODE) setTimeout(unlock, 300);
      else { buzz(120); sfx.bad(); $("disp").classList.add("shake"); setTimeout(() => { entry = ""; draw(); }, 450); }
    }
  }
  draw();
};

/* ---------- otključavanje ---------- */
async function unlock() {
  closeSheet();
  const box = $("oBox");
  $("flash").classList.add("go");
  $("lockBadge").textContent = "🔓";
  box.classList.remove("pulse"); box.firstChild.nodeValue = "🎁"; boing(box);
  sparkle(box, 70); sfx.win(); buzz([80, 60, 80, 60, 200]);
  await wait(1100);
  $("reveal").innerHTML = esc(LINE);
  $("overlay").classList.add("show");
  floaters(); confetti();
  await wait(700); fireworks(8);
  await wait(4200); fireworks(5);
}

/* ---------- nagoveštaji ---------- */
$("hintBtn").onclick = () => {
  if (solved.every(Boolean)) return toast("Dodirnite kutiju i unesite kod 🔓");
  if (!solved[0]) return toast(state.note ? "Iskoristite belešku na prozoru: od jutra do noći." : "Potražite belešku negde gde se lepo sedi.");
  if (!solved[1]) return toast("Stari sat ima zagonetku za vas.");
  if (!solved[2]) return toast(`Sitna stvorenja lepršaju po sobi. Pronađeno ${state.flies}/3.`);
  if (!solved[3]) return toast("Na polici ima nešto što tu ne pripada.");
};

/* ---------- start ---------- */
$("startBtn").onclick = () => { ac(); sfx.good(); $("intro").classList.add("hide"); buzz(10); };
</script>
</body>
</html>
